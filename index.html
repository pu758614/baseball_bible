<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒球查經</title>
    <link rel="stylesheet" href="style.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- tsParticles 背景 -->
    <div id="tsparticles"></div>

    <header>
        <h1>棒球查經</h1>
    </header>

    <div class="game-container">
        <!-- 分數板 -->
        <div class="scoreboard">
            <div class="team-score">
                <div class="team">
                    <h2 id="team1-name-display">攻擊隊</h2>
                    <div id="team1-score" class="score">0</div>
                </div>
                <div class="team">
                    <h2 id="team2-name-display">守備隊</h2>
                    <div id="team2-score" class="score">0</div>
                </div>
            </div>
            <div class="game-info">
                <div class="inning">
                    <span>局數: </span>
                    <span id="current-inning">1</span> / <span id="total-innings">3</span>
                </div>
                <div class="outs">
                    <span>出局數: </span>
                    <span id="outs-count">0</span>
                </div>
                <div class="current-team">
                    <span>現在攻擊: </span>
                    <span id="batting-team">攻擊隊</span>
                </div>
            </div>
        </div>

        <!-- 棒球場區域 -->
        <div class="baseball-field">
            <!-- 外野草地紋理 -->
            <div class="field-grass-pattern"></div>
            <!-- 內野泥土區 -->
            <div class="infield-dirt"></div>
            <!-- 壘包路徑線 (SVG) -->
            <svg class="base-paths" viewBox="0 0 300 300">
                <!-- 外圈發光線 -->
                <polygon points="150,52 218,150 150,248 82,150" fill="none" stroke="rgba(255,215,0,0.12)" stroke-width="18" stroke-linejoin="round"/>
                <!-- 壘包路徑 -->
                <polygon points="150,52 218,150 150,248 82,150" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8,4"/>
                <!-- 界外線 -->
                <line x1="150" y1="248" x2="280" y2="30" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
                <line x1="150" y1="248" x2="20" y2="30" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
            </svg>
            <!-- 投手丘 -->
            <div class="pitcher-mound"></div>
            <!-- 壘包 -->
            <div class="home-plate" id="home">
                <div class="home-plate-shape"></div>
            </div>
            <div class="base" id="first-base"><div class="base-diamond"></div><span class="base-label">1B</span></div>
            <div class="base" id="second-base"><div class="base-diamond"></div><span class="base-label">2B</span></div>
            <div class="base" id="third-base"><div class="base-diamond"></div><span class="base-label">3B</span></div>

            <!-- 跑者 -->
            <div class="runner" id="runner-home" style="display: none;"><span class="runner-icon">⚾</span></div>
            <div class="runner" id="runner-first" style="display: none;"><span class="runner-icon">⚾</span></div>
            <div class="runner" id="runner-second" style="display: none;"><span class="runner-icon">⚾</span></div>
            <div class="runner" id="runner-third" style="display: none;"><span class="runner-icon">⚾</span></div>
        </div>

        <!-- 得分特效 (放在 game-container 層級) -->
        <div id="score-effect" class="score-effect" style="display: none;">
            <span id="score-effect-text">恭喜得分!</span>
        </div>

        <!-- 攻守交換提示 -->
        <div id="team-switch-effect" class="score-effect" style="display: none;">
            <span id="team-switch-text">攻守交換!</span>
        </div>

        <!-- 打擊動畫覆蓋層 -->
        <div id="hit-animation-overlay" class="hit-animation-overlay" style="display: none;">
            <div class="hit-anim-content">
                <div class="hit-anim-bat">🏏</div>
                <div class="hit-anim-ball">⚾</div>
                <div class="hit-anim-impact">💥</div>
                <div class="hit-anim-result" id="hit-anim-result"></div>
            </div>
        </div>

        <!-- 打擊按鈕區域 -->
        <div class="question-area">
            <div class="buttons">
                <button id="hit-button" class="action-button">打擊!</button>
            </div>
        </div>

        <!-- 題目蓋板視窗 -->
        <div id="question-modal" class="question-modal" style="display: none;">
            <div class="question-modal-content">
                <div id="question-container">
                    <div class="question-type">
                        <span id="question-difficulty"></span>
                    </div>
                    <div class="question-text">
                        <p id="question-content"></p>
                    </div>
                </div>
                <div id="answer-buttons" class="buttons" style="display: none;">
                    <button id="correct-button" class="result-button correct">答對</button>
                    <button id="wrong-button" class="result-button wrong">答錯</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 遊戲設定對話框 -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>遊戲設定</h2>
            <div class="settings-form">
                <div class="setting-item">
                    <label for="team1-name">攻擊隊名稱:</label>
                    <input type="text" id="team1-name" placeholder="請輸入第一隊名稱" maxlength="20">
                </div>
                <div class="setting-item">
                    <label for="team2-name">守備隊名稱:</label>
                    <input type="text" id="team2-name" placeholder="請輸入第二隊名稱" maxlength="20">
                </div>
                <div class="setting-item">
                    <label for="innings-setting">局數設定:</label>
                    <select id="innings-setting">
                        <option value="3">3局</option>
                        <option value="5">5局</option>
                        <option value="7">7局</option>
                    </select>
                </div>
                <div class="buttons">
                    <button id="start-game" class="action-button">開始遊戲</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 遊戲結束對話框 -->
    <div id="game-over-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>遊戲結束</h2>
            <div id="winner-display"></div>
            <div class="final-score">
                <p><span id="final-team1-name">攻擊隊</span>: <span id="final-score-team1">0</span></p>
                <p><span id="final-team2-name">守備隊</span>: <span id="final-score-team2">0</span></p>
            </div>
            <div class="buttons">
                <button id="new-game" class="action-button">新遊戲</button>
            </div>
        </div>
    </div>

    <!-- 遊戲繼續對話框 -->
    <div id="continue-game-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>發現進行中的遊戲</h2>
            <div class="game-status">
                <p>有一個進行中的遊戲：</p>
                <p>局數：<span id="saved-inning">0</span>/<span id="saved-total-innings">0</span></p>
                <p><span id="saved-team1-name">攻擊隊</span>：<span id="saved-team1-score">0</span> 分</p>
                <p><span id="saved-team2-name">守備隊</span>：<span id="saved-team2-score">0</span> 分</p>
                <p>現在攻擊：<span id="saved-current-team">攻擊隊</span></p>
            </div>
            <div class="buttons">
                <button id="continue-game" class="action-button">繼續遊戲</button>
                <button id="start-new-game" class="action-button">開始新遊戲</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <!-- tsParticles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="particles-config.js"></script>
</body>
</html>
